name: Release

on:
  workflow_dispatch:
  push:

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Verify patch category documentation
        run: python3 -B .github/scripts/test_generate_patches_readme.py

      - name: Verify external release artifact paths
        run: node .github/scripts/test_release_artifact_paths.cjs

      # Verify the complete Gradle graph before release preparation or publication.
      # Run for every branch and commit, including commits that do not trigger a release.
      - name: Verify project builds, tests and catalogs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew clean :patches:test :patches:buildAndroid :patches:generatePatchesList -PreleaseChannel=${{ github.ref_name == 'main' && 'stable' || 'experimental' }} --no-daemon

      # Keep the verified branch bundle available for intentional on-device testing.
      # This does not publish a release or activate a headset patch.
      - name: Resolve verified branch bundle
        if: github.ref_name != 'main' && github.ref_name != 'dev'
        id: branch_bundle
        run: |
          export RELEASE_VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' gradle.properties | tr -d '\r')"
          node .github/scripts/resolve_release_artifact.cjs

      - name: Save verified branch bundle
        if: github.ref_name != 'main' && github.ref_name != 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: morphe-branch-${{ github.sha }}
          path: ${{ steps.branch_bundle.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      # Semantic release runs its own Gradle build command.
      # Only dev and main branch will generate a release as specified by .releaserc
      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve released bundle
        if: steps.release.outputs.new_release_published == 'true'
        id: release_artifact
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.new_release_version }}
        run: node .github/scripts/resolve_release_artifact.cjs

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Morphe Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: ${{ steps.release_artifact.outputs.path }}
